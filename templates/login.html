{% extends "base.html" %}

{% block content %}
<style>
    /* Fondo con imagen */
    body {
        background-image: url('/static/images/fondo_login.jpg');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        min-height: 100vh;
    }
    
    /* Overlay para oscurecer el fondo */
    body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 0;
    }
    
    .container {
        position: relative;
        z-index: 1;
    }
    
    .card {
        backdrop-filter: blur(10px);
        background: rgba(255, 255, 255, 0.95) !important;
        border: 2px solid rgba(212, 175, 55, 0.5) !important;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5) !important;
        border-radius: 20px !important;
        overflow: hidden;
    }
    
    /* Efecto de brillo en el borde */
    .card::before {
        content: '';
        position: absolute;
        top: -2px;
        left: -2px;
        right: -2px;
        bottom: -2px;
        background: linear-gradient(45deg, #8B0000, #D4AF37, #8B0000, #D4AF37);
        background-size: 400% 400%;
        z-index: -1;
        border-radius: 22px;
        animation: gradient 3s ease infinite;
    }
    
    @keyframes gradient {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }
    
    .min-vh-75 {
        min-height: 80vh;
    }
    
    .form-control {
        border-radius: 12px !important;
        border: 2px solid #e0e0e0 !important;
        padding: 12px 16px !important;
        transition: all 0.3s ease;
    }
    
    .form-control:focus {
        border-color: #D4AF37 !important;
        box-shadow: 0 0 0 0.25rem rgba(212, 175, 55, 0.25) !important;
        transform: translateY(-2px);
    }
    
    .btn-login {
        background: linear-gradient(135deg, #8B0000 0%, #D4AF37 100%);
        color: white;
        border: none;
        border-radius: 12px;
        padding: 14px;
        font-weight: 700;
        font-size: 1.1rem;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(139, 0, 0, 0.3);
    }
    
    .btn-login:hover {
        transform: scale(1.03);
        box-shadow: 0 8px 30px rgba(139, 0, 0, 0.4);
        color: white;
    }
    
    .header-gradient {
        background: linear-gradient(135deg, #8B0000 0%, #D4AF37 100%);
        padding: 25px 20px;
        border: none;
        position: relative;
        overflow: hidden;
    }
    
    .header-gradient::after {
        content: '✦';
        position: absolute;
        right: -20px;
        top: -20px;
        font-size: 80px;
        opacity: 0.1;
        color: white;
        transform: rotate(20deg);
    }
    
    .header-gradient::before {
        content: '✦';
        position: absolute;
        left: -20px;
        bottom: -20px;
        font-size: 80px;
        opacity: 0.1;
        color: white;
        transform: rotate(-20deg);
    }
    
    .footer-login {
        background: rgba(248, 249, 250, 0.9);
        border-top: 2px solid #D4AF37;
        padding: 12px;
        text-align: center;
    }
    
    .footer-login small {
        color: #666;
    }
    
    .footer-login i {
        color: #D4AF37;
    }
</style>

<div class="row justify-content-center align-items-center min-vh-75">
    <div class="col-md-5 col-lg-4">
        <div class="card border-0">
            <!-- Cabecera -->
            <div class="header-gradient text-center text-white">
                <div class="display-3 mb-2">🏆</div>
                <h2 class="fw-bold mb-0" style="letter-spacing: 2px;">JULLULLUMA</h2>
                <h3 class="fw-bold mb-0" style="letter-spacing: 3px;">RAIMI 2026</h3>
                <p class="mb-0 mt-2 opacity-75 small">
                    <i class="bi bi-star-fill"></i>
                    Concurso de Danzas
                    <i class="bi bi-star-fill"></i>
                </p>
            </div>
            
            <div class="card-body p-4">
                <h5 class="text-center mb-4 fw-bold" style="color: #8B0000;">
                    <i class="bi bi-box-arrow-in-right"></i> Iniciar Sesión
                </h5>
                
                <form method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold" style="color: #333;">
                            <i class="bi bi-person"></i> Usuario
                        </label>
                        <input type="text" class="form-control" id="username" name="username" 
                               placeholder="Ingresa tu usuario" required>
                    </div>
                    
                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold" style="color: #333;">
                            <i class="bi bi-lock"></i> Contraseña
                        </label>
                        <input type="password" class="form-control" id="password" name="password" 
                               placeholder="Ingresa tu contraseña" required>
                    </div>
                    
                    <button type="submit" class="btn-login w-100">
                        <i class="bi bi-box-arrow-in-right"></i> Ingresar
                    </button>
                </form>
                
                <div class="text-center mt-4">
                    <small class="text-muted">
                        <i class="bi bi-shield-check"></i> Sistema Seguro
                    </small>
                </div>
            </div>
            
            <!-- Footer -->
            <div class="footer-login">
                <small>
                    <i class="bi bi-building"></i>
                    Municipalidad Distrital de Santa Rosa
                    <i class="bi bi-building"></i>
                </small>
                <br>
                <small style="font-size: 0.7rem; color: #aaa;">
                    <i class="bi bi-star-fill"></i>
                    <i class="bi bi-star-fill"></i>
                    <i class="bi bi-star-fill"></i>
                </small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
